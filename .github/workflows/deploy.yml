name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marsrut-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify release
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check app scripts tests run.py
          python -m ruff format --check app scripts tests run.py
          python -m pytest -q

      - name: Build archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=.venv \
            --exclude=data \
            --exclude=logs \
            --exclude=backups \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=.ruff_cache \
            -czf "/tmp/marsrut_bot_${GITHUB_SHA}.tar.gz" .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "${DEPLOY_PORT:-22}" \
            "/tmp/marsrut_bot_${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/marsrut_bot_${GITHUB_SHA}.tar.gz"

      - name: Install and restart only marsrut-bot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR=/opt/marsrut-bot
          SERVICE=marsrut-bot.service
          ARCHIVE="/tmp/marsrut_bot_${DEPLOY_SHA}.tar.gz"
          BACKUP="$APP_DIR/backups/code-before-${DEPLOY_SHA}.tar.gz"

          cd "$APP_DIR"
          sudo -u marsrut-bot .venv/bin/python -m scripts.backup
          sudo tar \
            --exclude=.venv \
            --exclude=.env \
            --exclude=data \
            --exclude=logs \
            --exclude=backups \
            -czf "$BACKUP" \
            -C "$APP_DIR" .

          rollback() {
            exit_code=$?
            trap - ERR
            echo "Deployment failed; restoring the previous code"
            sudo systemctl stop "$SERVICE" || true
            sudo tar -xzf "$BACKUP" -C "$APP_DIR"
            sudo chown -R marsrut-bot:marsrut-bot "$APP_DIR"
            sudo systemctl start "$SERVICE"
            exit "$exit_code"
          }
          trap rollback ERR

          sudo systemctl stop "$SERVICE"
          sudo tar -xzf "$ARCHIVE" -C "$APP_DIR"
          sudo chown -R marsrut-bot:marsrut-bot "$APP_DIR"
          sudo -u marsrut-bot .venv/bin/pip install -r requirements.txt
          sudo -u marsrut-bot .venv/bin/python -m compileall -q app scripts run.py
          sudo systemctl start "$SERVICE"

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/health
          sudo systemctl is-active --quiet "$SERVICE"

          trap - ERR
          rm -f "$ARCHIVE"
          REMOTE
